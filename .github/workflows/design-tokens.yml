name: Design tokens

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check design-token compliance
        run: node scripts/check-design-tokens.cjs --strict
